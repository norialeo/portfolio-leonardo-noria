    <text x="20" y="82" fill="#303f9f" style="opacity:0;animation:v6 10s linear infinite">[11]:</text><text x="108" y="82"><tspan fill="#008000" font-weight="700">from</tspan><tspan fill="#212121"> sklearn.ensemble </tspan><tspan fill="#008000" font-weight="700">import</tspan><tspan fill="#212121"> RandomForestClassifier</tspan></text><text x="108" y="98"><tspan fill="#008000" font-weight="700">from</tspan><tspan fill="#212121"> sklearn.neighbors </tspan><tspan fill="#008000" font-weight="700">import</tspan><tspan fill="#212121"> KNeighborsClassifier</tspan></text><text x="108" y="114"><tspan fill="#212121">modelo_arvoredecisao = RandomForestClassifier()</tspan></text><text x="108" y="130"><tspan fill="#212121">modelo_knn = KNeighborsClassifier()</tspan></text><text x="108" y="146"><tspan fill="#408080" font-style="italic"># Treinar as IAs</tspan></text><text x="108" y="162"><tspan fill="#212121">modelo_arvoredecisao.fit(x_treino, y_treino); modelo_knn.fit(x_treino, y_treino)</tspan></text></g><g class="mono" font-size="11.5" style="opacity:0;animation:v7 10s linear infinite"><text x="20" y="190" fill="#d84315">Out[11]:</text><text x="108" y="190" fill="#212121">KNeighborsClassifier()</text></g><g class="mono" font-size="11.5">
