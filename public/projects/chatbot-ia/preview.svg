  <text x="120" y="92" font-size="30" font-weight="700" fill="#31333f">Chatbot com IA</text><g style="opacity:0;animation:v2 12s linear infinite"><rect x="120" y="122" width="28" height="28" rx="6" fill="#ff4b4b"/><circle cx="134" cy="133" r="4.5" fill="#fff"/><path d="M126 146 q8 -10 16 0" fill="#fff"/><text x="164" y="141" font-size="14" fill="#31333f">O que é machine learning?</text></g><g style="opacity:0;animation:v3 12s linear infinite"><rect x="112" y="166" width="576" height="81" rx="8" fill="#f0f2f6"/><rect x="120" y="174" width="28" height="28" rx="6" fill="#ffbd45"/><rect x="127" y="183" width="14" height="11" rx="3" fill="#fff"/><circle cx="131" cy="188.5" r="1.6" fill="#ffbd45"/><circle cx="137" cy="188.5" r="1.6" fill="#ffbd45"/><text x="164" y="192" font-size="14" fill="#31333f">Machine learning é uma área da inteligência artificial em que</text><text x="164" y="213" font-size="14" fill="#31333f">o computador aprende padrões a partir de dados, em vez de</text><text x="164" y="234" font-size="14" fill="#31333f">seguir regras programadas uma a uma.</text></g><g style="opacity:0;animation:v4 12s linear infinite"><rect x="120" y="262" width="28" height="28" rx="6" fill="#ff4b4b"/><circle cx="134" cy="273" r="4.5" fill="#fff"/><path d="M126 286 q8 -10 16 0" fill="#fff"/><text x="164" y="281" font-size="14" fill="#31333f">Me dá um exemplo prático?</text></g><g style="opacity:0;animation:v5 12s linear infinite"><rect x="112" y="306" width="576" height="60" rx="8" fill="#f0f2f6"/><rect x="120" y="314" width="28" height="28" rx="6" fill="#ffbd45"/><rect x="127" y="323" width="14" height="11" rx="3" fill="#fff"/><circle cx="131" cy="328.5" r="1.6" fill="#ffbd45"/><circle cx="137" cy="328.5" r="1.6" fill="#ffbd45"/><text x="164" y="332" font-size="14" fill="#31333f">Claro! Prever o score de crédito de um cliente: o modelo</text><text x="164" y="353" font-size="14" fill="#31333f">treina com o histórico de clientes e classifica novos casos.</text></g><rect x="112" y="430" width="576" height="44" rx="10" fill="#f0f2f6"/>
  <text x="130" y="457" font-size="14" fill="#a3a8b8" style="opacity:0;animation:v6 12s linear infinite">Pergunte alguma coisa...</text>
  <text x="130" y="457" font-size="14" fill="#a3a8b8" style="opacity:0;animation:v7 12s linear infinite">Pergunte alguma coisa...</text>
  <text x="130" y="457" font-size="14" fill="#a3a8b8" style="opacity:0;animation:v8 12s linear infinite">Pergunte alguma coisa...</text>
  <g style="opacity:0;animation:v9 12s linear infinite"><text x="130" y="457" font-size="14" fill="#31333f" style="clip-path:inset(0 100% 0 0);animation:t10 12s steps(25,end) infinite">O que é machine learning?</text></g>
  <g style="opacity:0;animation:v11 12s linear infinite"><text x="130" y="457" font-size="14" fill="#31333f" style="clip-path:inset(0 100% 0 0);animation:t12 12s steps(25,end) infinite">Me dá um exemplo prático?</text></g>
  <path d="M660 444 l14 8 l-14 8 l3 -8 z" fill="#a3a8b8"/>
