  <text x="660" y="25" font-size="12" fill="#31333f">Deploy</text><text x="712" y="25" font-size="14" fill="#31333f">⋮</text>
  <g style="opacity:0;animation:v0 12s linear infinite"><text x="520" y="25" font-size="11.5" fill="#808495">🏃 Running...</text></g>
