<text x="1110" y="401" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="400" fill="#6b6b6b" text-anchor="middle" letter-spacing="0.6">/contato</text>
<path d="M660 282 L1110 348" stroke="#6b6b6b" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
<text x="80" y="640" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#2b2b2b" text-anchor="start" letter-spacing="0">Back-end (Vercel Functions, Node + TypeScript): caixas escuras acima</text>
<rect x="380" y="520" width="260" height="80" rx="4" fill="#3a3a3a" stroke="#3a3a3a" stroke-width="1"/>
<text x="510" y="558" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0">GET /api/github</text>
<text x="510" y="576" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="400" fill="#ddd" text-anchor="middle" letter-spacing="0.6">perfil · repos · eventos · cache CDN</text>
