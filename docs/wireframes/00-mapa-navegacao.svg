<text x="810" y="558" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0">POST /api/ask</text>
<text x="810" y="576" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="400" fill="#ddd" text-anchor="middle" letter-spacing="0.6">Gemini (streaming) · chamado pelo Terminal</text>
<rect x="980" y="520" width="260" height="80" rx="4" fill="#3a3a3a" stroke="#3a3a3a" stroke-width="1"/>
<text x="1110" y="558" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0">POST /api/contact</text>
<text x="1110" y="576" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="400" fill="#ddd" text-anchor="middle" letter-spacing="0.6">Zod · isca · rate limit → Resend</text>
<path d="M510 422 L510 518" stroke="#6b6b6b" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)"/>
<path d="M260 422 L430 518" stroke="#6b6b6b" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)"/>
<path d="M1110 422 L1110 518" stroke="#6b6b6b" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)"/>
<text x="80" y="670" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="400" fill="#6b6b6b" text-anchor="start" letter-spacing="0.6">/api/github também alimenta a Home (atividade) e o Sobre (estatísticas). /api/ask é chamado pelo Terminal, disponível em todas as páginas.</text>
<text x="80" y="700" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="400" fill="#6b6b6b" text-anchor="start" letter-spacing="0.6">LINHAS TRACEJADAS = CHAMADAS HTTP DO NAVEGADOR PARA O BACK-END. AS CHAVES (RESEND, GEMINI, GITHUB) FICAM SÓ NO SERVIDOR.</text>
